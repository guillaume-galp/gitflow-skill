[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitflow-operator"
version = "0.1.0"
description = "Provider-neutral Gitflow command and skill"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gitflow-operator = "gitflow_operator.cli:main"

[tool.setuptools]
packages = ["gitflow_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
